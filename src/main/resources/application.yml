spring:
  application:
    name: manrisk

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manajemen_risiko}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1200000
      keepalive-time: 300000

  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        access:
          strategy: field
        use-new-id-generator-mappings: false

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}
      resolve-lazily: false

kertaskerja:
  kode-lembaga: x.xx
  status: MANAJEMEN-RISIKO-UP
  cors:
    enabled: true
    allowed-hosts:
      - http://localhost:3000
      - https://manrisk-test.zeabur.app
      - https://manrisk-service.zeabur.app
  security:
    mode: none


server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /manrisk/api
  tomcat:
    allow-encoded-slashes: true

# Generate AI is disabled until its server-only variables are supplied manually.
manrisk:
  internal:
    token: ${RISIKO_INTERNAL_TOKEN:}
  auth:
    base-url: ${AUTH_API_URL:}
    connect-timeout-seconds: ${MANRISK_AUTH_CONNECT_TIMEOUT_SECONDS:3}
    request-timeout-seconds: ${MANRISK_AUTH_REQUEST_TIMEOUT_SECONDS:3}
  ai:
    enabled: ${MANRISK_AI_ENABLED:false}
    rate-limit-per-minute: ${MANRISK_AI_RATE_LIMIT_PER_MINUTE:5}
    max-concurrent-requests: ${MANRISK_AI_MAX_CONCURRENT_REQUESTS:5}
    connect-timeout-seconds: ${MANRISK_AI_CONNECT_TIMEOUT_SECONDS:3}
    request-timeout-seconds: ${MANRISK_AI_REQUEST_TIMEOUT_SECONDS:45}
    provider-timeout-seconds: ${MANRISK_AI_PROVIDER_TIMEOUT_SECONDS:30}
    openrouter:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:openai/gpt-4.1-mini}

logging:
  level:
    root: warn
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        transaction: DEBUG
        orm:
          jdbc:
            bind: TRACE
      springdoc: DEBUG
      springframework:
        web: DEBUG
        security: DEBUG
      flywaydb: INFO
    io:
      swagger: DEBUG
    cc:
      kertaskerja:
        pengajuan_kta:
          security: DEBUG
        aop: DEBUG
    cc.kertaskerja.manrisk.service.risiko.ai: INFO

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  override-with-generic-response: false
  show-actuator: false
